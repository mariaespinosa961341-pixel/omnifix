<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Escolar - IPET N° 104 y Puente Negro</title>
    <style>
        :root {
            --bg-color: #d0f0ed; /* Turquesa claro */
            --primary-dark: #006666; /* Turquesa oscuro / iconos */
            --accent-color: #008080;
            --text-main: #2b3e3e;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Pantalla de Bienvenida */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111b1b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: var(--white);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .school-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
        }

        .welcome-content h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #ffcc00;
        }

        .welcome-content h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--white);
            font-weight: 400;
        }

        .welcome-content p {
            font-size: 0.95rem;
            margin-bottom: 25px;
            color: #b2dfdb;
        }

        .btn-enter {
            background-color: #ffcc00;
            color: #111b1b;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,204,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-enter:active {
            transform: scale(0.95);
        }

            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
