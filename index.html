<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Escolar - IPET N° 104 y Puente Negro</title>
    <style>
        :root {
            --bg-color: #d0f0ed;
            --primary-dark: #006666;
            --accent-color: #008080;
            --text-main: #2b3e3e;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Pantalla de Presentación y Bienvenida */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111b1b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: var(--white);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .school-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
            animation: pulseLogo 2s infinite ease-in-out;
        }

        .welcome-content h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #ffcc00;
        }

        .welcome-content h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--white);
            font-weight: 400;
        }

        .welcome-content p {
            font-size: 0.95rem;
            margin-bottom: 25px;
            color: #b2dfdb;
        }

        .btn-enter {
            background-color: #ffcc00;
            color: #111b1b;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,204,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-enter:active {
            transform: scale(0.95);
        }

        /* Contenido Principal */
        #main-content {
            display: none;
            width: 100%;
            max-width: 950px;
            padding: 20px;
            box-sizing: border-box;
        }

        #main-content.visible {
            display: block;
            animation: entradaCategorias 0.8s ease-out forwards;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        header h2 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-color);
        }

        /* Contenedor de las Tarjetas Superiores */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 102, 102, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            max-height: 190px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--primary-dark);
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin: 5px 0 15px 0;
        }

        .btn-voice {
            background-color: var(--primary-dark);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 3px 10px rgba(0, 102, 102, 0.2);
            margin-top: auto;
        }

        .btn-voice:hover {
            background-color: var(--accent-color);
        }

        .btn-voice:active {
            transform: scale(0.95);
        }

        /* Sección de Información Detallada (Abajo del todo) */
        .info-section {
            background-color: var(--white);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 102, 102, 0.15);
            margin-top: 20px;
        }

        .info-section h3 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .info-section p {
            font-size: 1rem;
            color: #333;
            line-height: 1.7;
            margin-bottom: 15px;
            text-align: justify;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes entradaCategorias {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
