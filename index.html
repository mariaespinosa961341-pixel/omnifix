<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>OmniFix Reparaciones - Cruz del Eje</title>

    <style>
        :root {
            --bg-dark: #0b1120;
            --card-dark: #131c31;
            --card-border: #1e293b;
            --accent: #f59e0b;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --mercadopago: #009ee3;
            --paypal: #0070ba;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.5;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--card-dark);
            padding: 1.8rem 1rem;
            text-align: center;
            border-bottom: 2px solid #000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .logo-circle {
            width: 58px;
            height: 58px;
            background: #131c31;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .logo-circle svg {
            width: 32px;
            height: 32px;
        }

        header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: white;
        }

        /* =========================
           BARRAS SUPERIORES
        ========================= */

        .badges {
            background: #d97706;
            color: #111;
            padding: 8px 6px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: bold;
        }

        .sub-badges {
            background: var(--card-dark);
            padding: 8px;
            text-align: center;
            font-size: 0.78rem;
            color: #34d399;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .action-banners {
            display: flex;
            border-bottom: 1px solid var(--card-border);
        }

        .banner-btn {
            flex: 1;
            background: var(--card-dark);
            text-align: center;
            padding: 9px 6px;
            font-size: 0.76rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
        }

        .banner-btn:first-child {
            border-right: 1px solid var(--card-border);
            color: #38bdf8;
        }

        .banner-btn:active {
            background: #1a2642;
        }

        /* =========================
           CONTENEDOR
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 1rem;
        }

        .section-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent);
            margin: 1rem 0;
            font-weight: 800;
        }

        /* =========================
           CATEGORÍAS
        ========================= */

        .category-card,
        .service-card {
            background: var(--card-dark);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 4px 8px -2px rgba(0,0,0,0.25);
            text-decoration: none;
            color: white;
            transition: 0.15s ease;
            user-select: none;
        }

        .category-card:hover,
        .service-card:hover {
            border-color: #334155;
            transform: translateY(-1px);
        }

        .category-card:active,
        .service-card:active {
            background: #1a2642;
            transform: scale(0.99);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .icon-box {
            width: 58px;
            height: 58px;
            background: #0b1120;
            border: 1px solid #2a3650;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 32px;
            height: 32px;
        }
