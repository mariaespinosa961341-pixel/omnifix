<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFix Reparaciones - Cruz del Eje</title>
    <style>
        :root {
            --bg-dark: #0b1120;
            --card-dark: #131c31;
            --card-border: #1e293b;
            --accent: #f59e0b;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --mercadopago: #009ee3;
            --paypal: #0070ba;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-light); line-height: 1.5; padding-bottom: 90px; }
        
        header { background: var(--card-dark); padding: 1.2rem 1rem; text-align: center; border-bottom: 2px solid #000; }
        .logo-container { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .logo-circle { width: 50px; height: 50px; background: #131c31; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.5px; color: white; }
        
        .badges { background: #d97706; color: #111; padding: 6px; text-align: center; font-size: 0.8rem; font-weight: bold; }
        .sub-badges { background: var(--card-dark); padding: 7px; text-align: center; font-size: 0.75rem; color: #34d399; border-bottom: 1px solid var(--card-border); display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        
        .action-banners { display: flex; border-bottom: 1px solid var(--card-border); }
        .banner-btn { flex: 1; background: var(--card-dark); text-align: center; padding: 9px 5px; font-size: 0.75rem; font-weight: bold; cursor: pointer; border: none; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none; }
        .banner-btn:first-child { border-right: 1px solid var(--card-border); color: #38bdf8; }

        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .section-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin: 0.8rem 0; font-weight: 800; }
        
        .category-card, .service-card { width: 100%; background: var(--card-dark); border: 1px solid var(--card-border); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); transition: 0.15s; color: white; }
        .category-card:hover, .service-card:hover { border-color: var(--accent); transform: translateY(-1px); }
        .category-card:active, .service-card:active { background: #1a2642; transform: scale(0.99); }
        
        .card-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .icon-box { width: 56px; height: 56px; background: #0b1120; border: 1px solid #2a3650; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-box svg { width: 32px; height: 32px; }

        .card-title { font-size: 0.9rem; font-weight: 700; color: white; line-height: 1.3; }
        
        .card-price { text-align: right; min-width: 95px; }
        .price-ars { font-weight: 800; color: var(--accent); font-size: 0.95rem; display: block; }
        .price-usd { font-size: 0.72rem; color: #34d399; display: block; font-weight: 600; }
        .arrow { color: var(--accent); font-size: 1.2rem; margin-left: 12px; font-weight: bold; }

        .back-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: var(--card-dark); padding: 0.8rem 1rem; border-radius: 10px; border: 1px solid var(--card-border); }
        .btn-back { background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        .detail-box { background: var(--card-dark); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; text-align: center; }
        .detail-icon { width: 80px; height: 80px; background: #0b1120; border: 2px solid var(--accent); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
        .detail-icon svg { width: 45px; height: 45px; }
        .detail-box h2 { font-size: 1.1rem; margin-bottom: 0.7rem; }
        .detail-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem; text-align: left; line-height: 1.5; }
        .total-box { background: #0b1120; border: 1px solid var(--card-border); border-radius: 10px; padding: 0.8rem; margin-bottom: 1rem; text-align: right; }
        .form-input { width: 100%; padding: 0.75rem; margin-bottom: 0.8rem; background: #0b1120; border: 1px solid var(--card-border); border-radius: 10px; color: white; font-size: 0.9rem; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        .form-input::placeholder { color: #64748b; }
        
        .qty-container { display: flex; align-items: center; justify-content: space-between; background: #0b1120; border: 1px solid var(--card-border); border-radius: 10px; padding: 0.5rem 1rem; margin-bottom: 1rem; }
        .qty-btn { background: var(--card-dark); color: var(--accent); border: 1px solid var(--card-border); width: 38px; height: 38px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        
        .btn-agregar { width: 100%; background: var(--accent); color: #0b1120; border: none; padding: 0.85rem; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.95rem; }
        
        .review-box { background: var(--card-dark); border: 1px solid var(--card-border); border-radius: 14px; padding: 1.2rem; margin-top: 1.5rem; }
        .review-title { text-align: center; color: var(--accent); font-size: 0.95rem; margin-bottom: 0.4rem; font-weight: bold; }
        .interactive-stars { text-align: center; font-size: 1.8rem; margin-bottom: 0.8rem; cursor: pointer; color: #475569; }
        .interactive-stars span { margin: 0 2px; }
        .interactive-stars span.rated { color: var(--accent); }
        .btn-submit { background: var(--accent); color: #0b1120; border: none; width: 100%; padding: 0.75rem; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .saved-reviews { margin-top: 1rem; text-align: left; border-top: 1px solid var(--card-border); padding-top: 0.8rem; }
        .review-item { background: #0b1120; padding: 0.7rem; border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.8rem; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: var(--card-dark); width: 100%; max-width: 420px; border-radius: 16px; padding: 1.5rem; text-align: center; border: 1px solid var(--card-border); }
        .btn-mp, .btn-paypal, .btn-maps-modal { width: 100%; padding: 0.85rem; border: none; border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-bottom: 0.6rem; }
        .btn-mp { background: var(--mercadopago); color: white; }
        .btn-paypal { background: var(--paypal); color: white; }
        .btn-maps-modal { background: #25d366; color: white; text-decoration: none; display: block; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-dark); border-top: 1px solid var(--card-border); padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.4); }
        .btn-checkout { background: var(--success); color: white; border: none; padding: 0.75rem 1.3rem; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.9rem; }

        @media (max-width: 400px) {
            header h1 { font-size: 1.05rem; }
            .card-title { font-size: 0.82rem; }
            .card-price { min-width: 80px; }
            .price-ars { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-circle">

    <div class="badges">⚡ Taller Abierto — Cruz del Eje, Córdoba (Casa Blanca)</div>

            <button type="button" class="category-card" onclick="selectCategory('Otros')">

                        <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8">
                            <path d="M6 3v6"/><path d="M18 3v6"/><path d="M4 9h16v3a8 8 0 0 1-16 0V9z"/><path d="M12 17v4"/>
                        </svg>
                    </div>

            <div class="review-box" id="review-section">

                <input type="text" id="review-name" class="form-input" placeholder="Tu Nombre">

                <button class="btn-submit" onclick="submitReview()">Publicar Opinión</button>
                
                <div class="saved-reviews">

        <!-- VISTA DINÁMICA -->
        <div id="dynamic-view" style="display:none;"></div>

    <div class="cart-bar" id="cart-bar" style="display:none;">
        <div>
            <span style="font-size:0.75rem; color:var(--text-muted); display:block;">Seleccionado:</span>

        <button class="btn-checkout" onclick="openPaymentModal()">💳 Pagar / Solicitar</button>

    <div class="modal" id="payment-modal">
        <div class="modal-content" id="modal-body-content">
            <h3 style="color:var(--accent); margin-bottom:0.5rem; font-size:1.2rem;">Elige Medio de Pago</h3>

    <script>
        const services = {
            "Celulares": [

        let currentCategory = null;

        let quantity = 1;

        const phoneTaller = "5493549589088";

        }

        function selectCategory(category) {
            if (!services[category]) return;
            currentCategory = category;
            selectedService = null;
            selectedIndex = null;
            quantity = 1;
            document.getElementById(
