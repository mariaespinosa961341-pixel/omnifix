<title>OmniFix Reparaciones - Cruz del Eje</title>

<style>
:root{
    --bg-dark:#0b1120;
    --card-dark:#131c31;
    --card-border:#1e293b;
    --accent:#f59e0b;
    --text-light:#fff;
    --text-muted:#94a3b8;
    --success:#10b981;
    --mercadopago:#009ee3;
    --paypal:#0070ba;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:var(--bg-dark);
    color:var(--text-light);
    line-height:1.5;
    padding-bottom:90px;
}

header{
    background:var(--card-dark);
    padding:1.2rem 1rem;
    text-align:center;
    border-bottom:2px solid #000;
}

.logo-container{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.logo-circle{
    width:50px;
    height:50px;
    background:#131c31;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--accent);
}

header h1{
    font-size:1.35rem;
    font-weight:800;
}

.badges{
    background:#d97706;
    color:#111;
    padding:6px;
    text-align:center;
    font-size:.8rem;
    font-weight:bold;
}

.sub-badges{
    background:var(--card-dark);
    padding:7px;
    text-align:center;
    font-size:.75rem;
    color:#34d399;
    border-bottom:1px solid var(--card-border);
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.action-banners{
    display:flex;
    border-bottom:1px solid var(--card-border);
}

.banner-btn{
    flex:1;
    background:var(--card-dark);
    text-align:center;
    padding:9px 5px;
    font-size:.75rem;
    font-weight:bold;
    cursor:pointer;
    border:none;
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    text-decoration:none;
}

.banner-btn:first-child{
    border-right:1px solid var(--card-border);
    color:#38bdf8;
}

.container{
    max-width:600px;
    margin:auto;
    padding:1rem;
}

.section-title{
    font-size:.9rem;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--accent);
    margin:.8rem 0;
    font-weight:800;
}

/* TARJETAS */

.category-card,
.service-card{
    width:100%;
    background:var(--card-dark);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:.9rem 1rem;
    margin-bottom:.75rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    color:white;
    box-shadow:0 4px 6px -1px rgba(0,0,0,.2);
    transition:.15s;
}

.category-card:hover,
.service-card:hover{
    border-color:var(--accent);
}

.category-card:active,
.service-card:active{
    background:#1a2642;
    transform:scale(.99);
}

.card-left{
    display:flex;
    align-items:center;
    gap:14px;
    flex:1;
    min-width:0;
}

.icon-box{
    width:56px;
    height:56px;
    background:#0b1120;
    border:1px solid #2a3650;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.icon-box svg{
    width:32px;
    height:32px;
}

.card-title{
    font-size:.9rem;
    font-weight:700;
    color:white;
    line-height:1.3;
}

.card-price{
    text-align:right;
    min-width:90px;
}

.price-ars{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
    display:block;
}

.price-usd{
    font-size:.72rem;
    color:#34d399;
    display:block;
    font-weight:600;
}

.arrow{
    color:var(--accent);
    font-size:1.2rem;
    margin-left:12px;
    font-weight:bold;
}

/* VOLVER */

.back-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:1rem;
    background:var(--card-dark);
    padding:.8rem 1rem;
    border-radius:10px;
    border:1px solid var(--card-border);
}

.btn-back{
    background:none;
    border:none;
    color:var(--accent);
    font-weight:bold;
    cursor:pointer;
    font-size:.9rem;
}

/* DETALLE */

.detail-box{
    background:var(--card-dark);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:1.5rem;
    text-align:center;
}

.detail-icon{
    width:80px;
    height:80px;
    background:#0b1120;
    border:2px solid var(--accent);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 1rem;
}

.detail-icon svg{
    width:45px;
    height:45px;
}

.detail-box h2{
    font-size:1.1rem;
    margin-bottom:.7rem;
}

.detail-desc{
    font-size:.85rem;
    color:var(--text-muted);
    margin-bottom:1.2rem;
    text-align:left;
}

.total-box{
    background:#0b1120;
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:.8rem;
    margin-bottom:1rem;
}

.form-input{
    width:100%;
    padding:.75rem;
    margin-bottom:.8rem;
    background:#0b1120;
    border:1px solid var(--card-border);
    border-radius:10px;
    color:white;
    font-size:.9rem;
    outline:none;
}

.form-input:focus{
    border-color:var(--accent);
}

.qty-container{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0b1120;
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:.5rem 1rem;
    margin-bottom:1rem;
}

.qty-btn{
    background:var(--card-dark);
    color:var(--accent);
    border:1px solid var(--card-border);
    width:38px;
    height:38px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:1.2rem;
}

.btn-agregar{
    width:100%;
    background:var(--accent);
    color:#0b1120;
    border:none;
    padding:.85rem;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
    font-size:.95rem;
}

/* OPINIONES */

.review-box{
    background:var(--card-dark);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:1.2rem;
    margin-top:1.5rem;
}

.review-title{
    text-align:center;
    color:var(--accent);
    font-size:.95rem;
    margin-bottom:.4rem;
    font-weight:bold;
}

.interactive-stars{
    text-align:center;
    font-size:1.8rem;
    margin-bottom:.8rem;
    cursor:pointer;
    color:#475569;
}

.interactive-stars span.rated{
    color:var(--accent);
}

.btn-submit{
    background:var(--accent);
    color:#0b1120;
    border:none;
    width:100%;
    padding:.75rem;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.saved-reviews{
    margin-top:1rem;
    border-top:1px solid var(--card-border);
    padding-top:.8rem;
}

.review-item{
    background:#0b1120;
    padding:.7rem;
    border-radius:8px;
    margin-bottom:.5rem;
    font-size:.8rem;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:200;
    justify-content:center;
    align-items:center;
    padding:1rem;
}

.modal-content{
    background:var(--card-dark);
    width:100%;
    max-width:420px;
    border-radius:16px;
    padding:1.5rem;
    text-align:center;
    border:1px solid var(--card-border);
}

.btn-mp,
.btn-paypal{
    width:100%;
    padding:.85rem;
    border:none;
    border-radius:10px;
    font-weight:800;
    font-size:.95rem;
    cursor:pointer;
    margin-bottom:.6rem;
    color:white;
}

.btn-mp{
    background:var(--mercadopago);
}

.btn-paypal{
    background:var(--paypal);
}

/* CARRITO */

.cart-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--card-dark);
    border-top:1px solid var(--card-border);
    padding:.8rem 1rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    z-index:100;
    box-shadow:0 -4px 15px rgba(0,0,0,.4);
}

.btn-checkout{
    background:var(--success);
    color:white;
    border:none;
    padding:.75rem 1.3rem;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:400px){

    header h1{
        font-size:1.05rem;
    }

    .card-title{
        font-size:.82rem;
    }

    .card-price{
        min-width:78px;
    }

    .price-ars{
        font-size:.82rem;
    }
}
</style>
</head>
