<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Escolar - IPET N° 104 y Puente Negro</title>
    <style>
        :root {
            --bg-color: #d0f0ed; /* Turquesa claro */
            --primary-dark: #006666; /* Turquesa oscuro / iconos */
            --accent-color: #008080;
            --text-main: #2b3e3e;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Pantalla de Animación de Bienvenida */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111b1b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: var(--white);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .school-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
        }

        .welcome-content h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #ffcc00;
        }

        .welcome-content h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--white);
            font-weight: 400;
        }

        .welcome-content p {
            font-size: 0.95rem;
            margin-bottom: 25px;
            color: #b2dfdb;
        }

        .btn-enter {
            background-color: #ffcc00;
            color: #111b1b;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,204,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-enter:active {
            transform: scale(0.95);
        }

        /* Contenido Principal de la Página */
        #main-content {
            display: none; /* Se muestra al hacer clic en entrar */
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        header h2 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2rem;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-color);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* Tarjeta de Información */
        .card {
            background-color: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 102, 102, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icon-container {
            width: 70px;
            height: 70px;
            background-color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border: 3px solid var(--primary-dark);
            font-size: 1.8rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin: 5px 0 15px 0;
        }

        .description {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: left;
        }

        .btn-voice {
            background-color: var(--primary-dark);
            color: var(--white);
            border: none;
            paddding: 12px 20px;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            margin-top: auto;
        }

        .btn-voice:hover {
            background-color: var(--accent-color);
        }
