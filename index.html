<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFix Reparaciones - Cruz del Eje</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent: #f59e0b;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.5; padding-bottom: 70px; }
        
        header { background: var(--card-dark); padding: 1.2rem 1rem; text-align: center; border-bottom: 1px solid var(--border); }
        .logo-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0.3rem; }
        .logo-circle { width: 45px; height: 45px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent); }
        header h1 { font-size: 1.3rem; letter-spacing: 0.5px; }
        
        .badges { background: rgba(245, 158, 11, 0.1); padding: 8px; text-align: center; font-size: 0.8rem; color: var(--accent); border-bottom: 1px solid var(--border); }
        .badges p { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .section-title { font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin: 1rem 0 0.8rem 0; font-weight: bold; }
        
        .category-card, .service-card { background: var(--card-dark); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 0.8rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .category-card:active, .service-card:active { background: #283548; }
        
        .card-left { display: flex; align-items: center; gap: 12px; }
        .card-icon { font-size: 1.5rem; }
        .card-title { font-size: 0.95rem; font-weight: bold; color: white; }
        .card-price { text-align: right; }
        .price-ars { font-weight: bold; color: var(--accent); font-size: 0.95rem; display: block; }
        .price-usd { font-size: 0.75rem; color: var(--text-muted); display: block; }

        .back-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: var(--card-dark); padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .btn-back { background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        /* Opiniones */
        .review-box { background: var(--card-dark); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-top: 1.5rem; }
        .review-title { text-align: center; color: var(--accent); font-size: 0.95rem; margin-bottom: 0.5rem; font-weight: bold; }
        .stars { text-align: center; color: var(--accent); font-size: 1.2rem; margin-bottom: 1rem; }
        .form-input { width: 100%; padding: 0.7rem; margin-bottom: 0.8rem; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 0.9rem; }
        .btn-submit { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 0.7rem; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Carrito flotante */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-dark); border-top: 1px solid var(--border); padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .btn-checkout { background: var(--success); color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: var(--card-dark); width: 100%; max-width: 400px; border-radius: 16px; padding: 1.5rem; text-align: center; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-circle">🛠️</div>
            <h1>OMNIFIX REPARACIONES</h1>
        </div>
    </header>

    <div class="badges">
        ⚡ Taller Abierto — Recepción y reparación de dispositivos
        <p>🔒 Pago 100% Protegido &nbsp;|&nbsp; 🛡️ 90 Días de Garantía</p>
    </div>

    <div class="container" id="main-container">
        <!-- Contenido dinámico -->
    </div>

    <div class="cart-bar" id="cart-bar" style="display:none;">
        <div>
            <span style="font-size: 0.8rem; color: var(--text-muted); display:block;">Seleccionado:</span>
            <span id="cart-total-text" style="font-weight: bold; color: var(--accent);">0 servicios</span>
        </div>
        <button class="btn-checkout" onclick="openCheckout()">Solicitar y Pagar</button>
    </div>

    <!-- Modal Final -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <h3 style="color: var(--accent); margin-bottom: 1rem;">Finalizar Solicitud</h3>
            <div id="modal-form">
                <input type="text" id="client-name" class="form-input" placeholder="Tu Nombre y Apellido">
                <input type="text" id="client-device" class="form-input" placeholder="Modelo del equipo (ej: Moto E32 / PS4)">
                <button class="btn-submit" onclick="sendWhatsApp()">📲 Enviar Pedido por WhatsApp</button>
                <button onclick="closeModal()" style="background:none; border:none; color:var(--text-muted); margin-top:10px; cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { id: "Celulares", name: "CELULARES Y TABLETS", icon: "📱" },
            { id: "Computadoras", name: "COMPUTADORAS Y LAPTOPS", icon: "💻" },
            { id: "Auriculares", name: "AURICULARES Y AUDIO", icon: "🎧" },
            { id: "Consolas", name: "CONSOLAS Y JOYSTICKS", icon: "🎮" },
            { id: "Otros", name: "OTROS DISPOSITIVOS", icon: "🔌" }
        ];

        const services = {
            "Celulares": [
                { name: "Cambio de Pantalla / Módulo completo", ars: 25000, usd: 25 },
                { name: "Cambio de Pin / Puerto de Carga", ars: 18000, usd: 18 },
                { name: "Cambio de Batería Original/Genérica", ars: 20000, usd: 20 },
                { name: "Cambio de Tapa Trasera (Moto E32, Moto G, Samsung, Xiaomi)", ars: 18000, usd: 18 },
                { name: "Cambio de Cristales / Lentes de Cámara", ars: 12000, usd: 12 },
                { name: "Reparación de Auricular / Micrófono", ars: 15000, usd: 15 },
                { name: "Formateo, Software o Desbloqueo", ars: 15000, usd: 15 }
            ],
            "Computadoras": [
                { name: "Instalación de Sistema Operativo Liviano + Optimización", ars: 20000, usd: 20 },
                { name: "Mantenimiento Preventivo (Pasta Térmica + Limpieza)", ars: 30000, usd: 30 },
                { name: "Formateo + Windows 11 / 10 + Office", ars: 22000, usd: 22 },
                { name: "Cambio de Disco HDD a SSD ultrarrápido", ars: 28000, usd: 28 },
                { name: "Cambio de Pantalla de Notebook", ars: 35000, usd: 35 },
                { name: "Cambio de Teclado de Notebook", ars: 20000, usd: 20 },
                { name: "Reparación / Reconstrucción de Bisagras", ars: 32000, usd: 32 },
                { name: "Armado de PC Gamer / Escritorio", ars: 40000, usd: 40 }
            ],
            "Auriculares": [
                { name: "Cambio de Parlante / Bocina Interna (Bajo / Nulo volumen)", ars: 14000, usd: 14 },
                { name: "Cambio de Placa Lógica / Circuito Bluetooth", ars: 16000, usd: 16 },
                { name: "Cambio de Microbatería Interna (Auricular o Estuche)", ars: 15000, usd: 15 },
                { name: "Cambio de Pin / Conector de Carga de Estuche", ars: 12000, usd: 12 },
                { name: "Reparación de Ficha Jack 3.5mm / Cable", ars: 10000, usd: 10 }
            ],
            "Consolas": [
                { name: "Limpieza Profunda + Pasta Térmica (PS4 / PS5 / Xbox)", ars: 35000, usd: 35 },
                { name: "Reparación de Joystick: Drift Analógico", ars: 18000, usd: 18 }
            ],
            "Otros": [
                { name: "Diagnóstico General y Presupuesto en Taller", ars: 8000, usd: 8 },
                { name: "Reparación de Cargador o Fuente Externa", ars: 12000, usd: 12 }
            ]
        };

        let currentCategory = null;
        let selectedService = null;
        const phoneTaller = "5493549000000"; // Reemplaza con tu número real

        function render() {
            const container = document.getElementById('main-container');
            
            if (!currentCategory) {
                let html = `<div class="section-title">Categorías</div>`;
                categories.forEach(cat => {
                    html += `
                        <div class="category-card" onclick="selectCategory('${cat.id}')">
                            <div class="card-left">
                                <span class="card-icon">${cat.icon}</span>
                                <span class="card-title">${cat.name}</span>
                            </div>
                            <span>➔</span>
                        </div>
                    `;
                });

                html += `
                    <div class="review-box">
                        <div class="review-title">⭐ Deja tu Calificación y Opinión</div>
                        <div class="stars">★★★★★</div>
                        <input type="text" class="form-input" placeholder="Tu Nombre">
                        <input type="text" class="form-input" placeholder="Escribe tu opinión sobre nuestro servicio técnico...">
                        <button class="btn-submit" onclick="alert('¡Gracias por tu opinión!')">Publicar Opinión</button>
                    </div>
                `;
                container.innerHTML = html;
                document.getElementById('cart-bar').style.display = 'none';
            } else {
                let html = `
                    <div class="back-bar">
                        <button class="btn-back" onclick="currentCategory=null; render()">← Volver</button>
                        <span style="font-weight:bold; font-size:0.9rem; color:var(--accent);">${currentCategory.toUpperCase()}</span>
                    </div>
                    <div class="section-title">Selecciona un Servicio</div>
                `;
                
                services[currentCategory].forEach((s, idx) => {
                    let isSelected = selectedService === s;
                    html += `
                        <div class="service-card" style="border: ${isSelected ? '2px solid var(--success)' : '1px solid var(--border)'}" onclick="toggleService(${idx})">
                            <div class="card-left">
                                <span class="card-title">${s.name}</span>
                            </div>
                            <div class="card-price">
                                <span class="price-ars">$${s.ars.toLocaleString()}</span>
                                <span class="price-usd">(USD $${s.usd})</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        function selectCategory(catId) {
            currentCategory = catId;
            render();
        }

        function toggleService(idx) {
            selectedService = services[currentCategory][idx];
            render();
            document.getElementById('cart-bar').style.display = 'flex';
            document.getElementById('cart-total-text').innerText = selectedService.name;
        }

        function openCheckout() {
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function sendWhatsApp() {
            const name = document.getElementById('client-name').value || "Cliente";
            const device = document.getElementById('client-device').value || "Dispositivo";
            const msg = `Hola OmniFix! Soy ${name}. Mi equipo es un ${device}. Quiero solicitar el servicio de: ${selectedService.name} por un valor de $${selectedService.ars}.`;
            window.open(`https://wa.me/${phoneTaller}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        render();
    </script>
</body>
</html>
